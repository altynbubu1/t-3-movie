{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Title</title>
  <link rel="stylesheet" type="text/css" href="{% static 'css/style.css' %}">
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
</head>
<body>
<nav class="navbar navbar-inverse">
  <div class="container-fluid">
    <div class="navbar-header">
      <a class="navbar-brand" href="#">Cinema</a>
    </div>
    <ul class="nav navbar-nav">
      <li class="active"><a href="{% url 'main:home' %}">Home</a></li>
      <li><a href="{% url 'main:actors' %}">Actors</a></li>
      <li><a href="#">Address and Contacts</a></li>
    </ul>
    <form class="navbar-form navbar-left" action="/action_page.php">
      <div class="form-group">
        <input type="text" class="form-control" placeholder="Search" name="search">
      </div>
      <button type="submit" class="btn btn-default">Submit</button>
    </form>
  </div>
</nav>
<h2>Welcome to our Cinema</h2>
{% for l in movie %}
<div class="movie">
  <p class="movie-title">{{ l.name }}</p>
  <p class="movie-genre">{{ l.genre }}</p>
  <p>{{ l.description }}</p>
  <p><strong>Year:</strong> {{ l.year }}</p>
  <p><strong>Budget:</strong> {{ l.budget }}</p>
  <p><strong>Country:</strong> {{ l.country }}</p>
  <p><img src="{{ l.image.url }}" alt="{{ l.name }}"></p>
</div>
{% endfor %}
</body>
</html>
